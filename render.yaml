services:
  - type: web
    name: tienda-ropa
    env: php
    buildCommand: composer install --no-dev && php artisan config:cache && php artisan route:cache && php artisan migrate --force && npm install && npm run build
    startCommand: php artisan serve --host=0.0.0.0 --port=10000
    envVars:
      - key: APP_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false